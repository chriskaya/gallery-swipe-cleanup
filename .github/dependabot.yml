version: 2
updates:
  - package-ecosystem: pub
    directory: /app
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
    ignore:
      # Pinned by flutter_localizations for a given Flutter SDK: bumped with
      # the toolchain, never on its own (pub get fails otherwise).
      - dependency-name: intl
    groups:
      pub:
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: /app/android
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
