version: 2
updates:
  - package-ecosystem: pub
    directory: /app
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
    groups:
      pub:
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: /app/android
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
